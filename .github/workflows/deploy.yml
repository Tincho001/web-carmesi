name: Deploy to Hetzner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-carmesi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
    - name: Sync app on server and restart
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        envs: GITHUB_REPOSITORY,GITHUB_SHA,GITHUB_TOKEN
        script: |
          set -euo pipefail
          # Solo toca carpetas propias de Carmesí. La base y las fotos viven en
          # /var/www/carmesi-data (DATA_DIR) y nunca se tocan en el deploy.
          APP_DIR="/var/www/carmesi"
          STAGE_DIR="/var/www/carmesi-release"
          OLD_DIR="/var/www/carmesi-old"
          TMP_DIR="$(mktemp -d)"

          curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" \
            -o "$TMP_DIR/app.tar.gz"
          mkdir -p "$TMP_DIR/extract"
          tar -xzf "$TMP_DIR/app.tar.gz" -C "$TMP_DIR/extract"
          SOURCE_DIR="$(find "$TMP_DIR/extract" -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          cp -a "$SOURCE_DIR"/. "$STAGE_DIR"/
          if [ -f "$APP_DIR/.env" ]; then cp -a "$APP_DIR/.env" "$STAGE_DIR/.env"; fi
          printf '%s\n' "$GITHUB_SHA" > "$STAGE_DIR/.deploy-commit"

          cd "$STAGE_DIR"
          npm ci --omit=dev --no-audit --no-fund

          rm -rf "$OLD_DIR"
          if [ -d "$APP_DIR" ]; then mv "$APP_DIR" "$OLD_DIR"; fi
          mv "$STAGE_DIR" "$APP_DIR"

          cd "$APP_DIR"
          if pm2 describe carmesi >/dev/null 2>&1; then
            pm2 restart carmesi --update-env
          else
            pm2 start server.js --name carmesi --cwd "$APP_DIR"
          fi
          pm2 save

          PORT="$(grep -E '^PORT=' .env | cut -d= -f2 || true)"
          PORT="${PORT:-3200}"
          for i in 1 2 3 4 5; do
            sleep 2
            if wget -qO- "http://127.0.0.1:$PORT/api/health" | grep -q "$GITHUB_SHA"; then
              echo "Carmesí deployed: $GITHUB_SHA"
              rm -rf "$TMP_DIR"
              exit 0
            fi
          done
          echo "La app no respondió con el commit nuevo" >&2
          pm2 logs carmesi --lines 30 --nostream || true
          exit 1
