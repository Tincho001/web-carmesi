<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carmesí Bags — Volvemos muy pronto</title>
  <meta name="description" content="Carmesí Bags: carteras y bolsos en Mendoza. Volvemos muy pronto.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#5e1a22">
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bordo: #5e1a22;
      --crema-texto: #f6efe6;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Montserrat', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bordo);
      color: var(--crema-texto);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; }
    main {
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      gap: 36px;
      padding: 48px 16px 32px;
      text-align: center;
      background: radial-gradient(ellipse at 50% 38%, rgba(139, 25, 37, .55), transparent 65%), var(--bordo);
    }
    .marca { margin: auto 0; }
    .monograma { width: 110px; height: auto; margin: 0 auto 8px; opacity: .95; }
    h1 {
      margin: 0;
      font-family: var(--serif); font-weight: 400;
      font-size: clamp(60px, 16vw, 120px); line-height: 1; letter-spacing: .04em;
    }
    .sub {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      margin: 10px 0 40px;
      font-size: 13px; letter-spacing: .6em; text-transform: uppercase;
    }
    .sub span { width: 56px; height: 1px; background: currentColor; opacity: .6; }
    .emoji { font-size: 56px; line-height: 1; margin-bottom: 14px; }

    /* Animaciones: el logo se dibuja en un giro, el carretel se mece y el resto entra de a poco. */
    @property --giro { syntax: '<angle>'; inherits: false; initial-value: 360deg; }
    @keyframes dibujar { from { --giro: 0deg; } to { --giro: 360deg; } }
    @keyframes entrar { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes mecer { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg) translateY(-3px); } }
    .monograma { -webkit-mask: conic-gradient(from -90deg, #000 var(--giro), transparent 0); mask: conic-gradient(from -90deg, #000 var(--giro), transparent 0); animation: dibujar 1.6s cubic-bezier(.6, .1, .3, 1) .15s both; }
    .marca h1 { animation: entrar .9s ease .9s both; }
    .marca .sub { animation: entrar .9s ease 1.1s both; }
    .emoji { display: inline-block; transform-origin: 50% 80%; animation: entrar .8s ease 1.3s both, mecer 3.2s ease-in-out 2.1s infinite; }
    .titulo, .texto { animation: entrar .9s ease 1.45s both; }
    .ig-titulo, .redes, .usuario { animation: entrar .9s ease 1.65s both; }
    .autor { animation: entrar .9s ease 1.9s both; }
    @media (prefers-reduced-motion: reduce) {
      .monograma, .marca h1, .marca .sub, .emoji, .titulo, .texto, .ig-titulo, .redes, .usuario, .autor { animation: none; -webkit-mask: none; mask: none; }
    }
    .titulo { margin: 0; font-family: var(--serif); font-size: 30px; font-weight: 500; }
    .texto { margin: 8px 0 0; font-size: 14px; opacity: .8; }
    .ig-titulo { margin: 26px 0 10px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; opacity: .7; }
    .ig {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 11px 22px;
      border: 1px solid rgba(246, 239, 230, .5); border-radius: 999px;
      color: var(--crema-texto); text-decoration: none; font-size: 15px;
      transition: background .15s ease;
    }
    .ig:hover { background: rgba(246, 239, 230, .1); }
    .ig strong { font-weight: 600; }
    .ig svg { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .ig svg .punto { fill: currentColor; stroke: none; }
    .ig--tt svg { fill: currentColor; stroke: none; }
    .redes { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .usuario { margin: 10px 0 0; font-size: 13px; opacity: .75; }
    .autor { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .autor p { margin: 0; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; opacity: .6; }
    .autor img { width: 110px; height: auto; border-radius: 12px; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
  </style>
</head>
<body>
  <main>
    <div class="marca">
      <img class="monograma" src="/assets/img/monograma-claro.png" alt="" width="595" height="530">
      <h1>Carmesí</h1>
      <p class="sub"><span></span>Bags<span></span></p>
      <div class="emoji" aria-hidden="true">🌙</div>
      <p class="titulo">Volvemos muy pronto</p>
      <p class="texto">Nuestra tienda online se está tomando un pequeño descanso.<br>Mientras tanto, seguimos atendiendo por WhatsApp y en las redes 💛</p>
      <p class="ig-titulo">Escribinos o seguinos</p>
      <div class="redes">
        <a class="ig ig--tt" href="https://wa.me/{{WA}}?text=%C2%A1Hola%20Carmes%C3%AD!%20" target="_blank" rel="noopener" aria-label="Escribirle a Carmesí por WhatsApp">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.6-.3Z"/></svg>
          <strong>WhatsApp</strong>
        </a>
        <a class="ig" href="https://instagram.com/bags_carmesi" target="_blank" rel="noopener" aria-label="Instagram de Carmesí: @bags_carmesi">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" class="punto"/></svg>
          <strong>Instagram</strong>
        </a>
        <a class="ig ig--tt" href="https://www.tiktok.com/@bags_carmesi" target="_blank" rel="noopener" aria-label="TikTok de Carmesí: @bags_carmesi">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.6 3c.4 2.3 1.8 3.8 4 4v3.1c-1.5 0-2.9-.4-4-1.2v6.3A6.2 6.2 0 1 1 10.4 9v3.2a3 3 0 1 0 3 3V3h3.2Z"/></svg>
          <strong>TikTok</strong>
        </a>
      </div>
      <p class="usuario">@bags_carmesi</p>
    </div>

    <div class="autor">
      <p>Sitio web por</p>
      <img src="/assets/img/pixel-cuyo-vertical.png" alt="Pixel Cuyo" width="900" height="780">
    </div>
  </main>
</body>
</html>
