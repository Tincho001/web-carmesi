# /etc/nginx/sites-available/carmesi
# Bloque propio de Carmesí (carmesibags.com.ar).
# Certbot agrega después la parte de HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name carmesibags.com.ar www.carmesibags.com.ar;

    # Fotos sacadas con el celu (ya llegan achicadas, esto es margen).
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
